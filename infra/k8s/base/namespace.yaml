apiVersion: v1
kind: Namespace
metadata:
  name: agentatlas
  labels:
    app.kubernetes.io/name: agentatlas
    # Pod Security Standards enforcement — restricted profile blocks
    # privileged containers, host namespace sharing, and requires
    # non-root + read-only root filesystem. This is a namespace-level
    # admission control, not optional per-pod config someone can skip.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: agentatlas-quota
  namespace: agentatlas
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    pods: "40"
---
# LimitRange sets sane defaults so a pod manifest that forgets to specify
# resources doesn't silently get unbounded (and therefore unschedulable-
# at-scale, noisy-neighbor-prone) requests.
apiVersion: v1
kind: LimitRange
metadata:
  name: agentatlas-limits
  namespace: agentatlas
spec:
  limits:
    - default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 256Mi
      type: Container
