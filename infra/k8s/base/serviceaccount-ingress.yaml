apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentatlas-api
  namespace: agentatlas
  annotations:
    # IRSA — federates this K8s ServiceAccount to an IAM role via OIDC, so
    # pods using this SA can call AWS APIs (e.g. SES for alert emails, if
    # added later) without any static credential ever existing in-cluster.
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/agentatlas-api-pod-role
automountServiceAccountToken: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentatlas-ingress
  namespace: agentatlas
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Rate limiting at the ingress layer too — defense in depth alongside
    # the application's own login rate limiter. This one protects every
    # route, not just /auth/login.
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-connections: "20"
    # Timeouts tuned for the slowest legitimate endpoint (discovery trigger,
    # which kicks off a background job and should return fast, but connector
    # test calls can be slower) — not left at nginx defaults, which are
    # often too short for any real backend work.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
spec:
  tls:
    - hosts: ["api.agentatlas.io"]
      secretName: agentatlas-tls
  rules:
    - host: api.agentatlas.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agentatlas-api
                port:
                  number: 80
---
# WebSocket needs sticky-ish handling at the ingress (long-lived connection,
# not a short request/response) — separate annotation block via a dedicated
# Ingress resource avoids accidentally applying WS timeout config to normal
# REST traffic.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentatlas-ws-ingress
  namespace: agentatlas
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Long timeout for the WebSocket event stream — this connection is
    # meant to stay open for the lifetime of a dashboard session, not 30s.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  tls:
    - hosts: ["api.agentatlas.io"]
      secretName: agentatlas-tls
  rules:
    - host: api.agentatlas.io
      http:
        paths:
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: agentatlas-api
                port:
                  number: 80
