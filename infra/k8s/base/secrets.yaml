apiVersion: v1
kind: ConfigMap
metadata:
  name: agentatlas-config
  namespace: agentatlas
data:
  # Non-secret config only. Anything sensitive (DB password, JWT secret,
  # connector API keys) goes through ExternalSecret below — never in a
  # ConfigMap, which is base64-encoded-but-not-encrypted and visible to
  # anyone with `kubectl get configmap -o yaml` access to the namespace.
  CORS_ALLOWED_ORIGINS: "https://app.agentatlas.io"
  TOKEN_EXPIRE_HOURS: "8"
  RATE_LIMIT_LOGIN_PER_MINUTE: "10"
---
# ExternalSecret (requires External Secrets Operator installed in-cluster)
# pulls from AWS Secrets Manager / Azure Key Vault at runtime and syncs into
# a native Kubernetes Secret. This means:
#   1. The actual secret VALUE never touches Git, ever, in any form.
#   2. Rotating a secret in Secrets Manager auto-propagates here on the next
#      refreshInterval — no manual `kubectl create secret` + rolling restart.
#   3. Audit trail for secret access lives in CloudTrail/Azure Activity Log,
#      not scattered across kubectl history on individual operators' machines.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: agentatlas-app-secrets
  namespace: agentatlas
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager  # or azure-keyvault — see secretstore.yaml
    kind: ClusterSecretStore
  target:
    name: agentatlas-app-secrets
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: agentatlas/production/app-secrets
        property: JWT_SECRET
    - secretKey: DATABASE_URL
      remoteRef:
        key: agentatlas/production/db-credentials
        property: connection_string
    - secretKey: FERNET_KEY
      remoteRef:
        key: agentatlas/production/app-secrets
        property: FERNET_KEY
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        # IRSA (IAM Roles for Service Accounts) — the ESO pod assumes an IAM
        # role via the service account's OIDC-federated identity, not a
        # static AWS access key sitting in a Kubernetes Secret. No long-lived
        # cloud credentials exist inside the cluster at all.
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets
