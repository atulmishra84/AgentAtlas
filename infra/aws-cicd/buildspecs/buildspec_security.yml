version: 0.2

# ── Security gate: boot the image from ECR, run the 22-check suite ───────────
# This stage receives the build artifact (which contains image_metadata.json)
# so it knows exactly which image tag to test. It pulls that image, runs it
# locally inside CodeBuild (PrivilegedMode: true), then runs security_gate.py
# against it. If the score < 95 the build fails and CodePipeline stops here —
# the image never reaches the ECS service.

phases:
  install:
    runtime-versions:
      python: "3.12"
    commands:
      - pip install --upgrade pip --quiet
      # The security gate script only needs the stdlib — no extra packages.
      - echo "Security gate environment ready"

  pre_build:
    commands:
      - echo "=== Pre-build: pull image from ECR ==="
      - IMAGE_TAG=$(python3 -c "import json; d=json.load(open('image_metadata.json')); print(d['imageTag'])")
      - IMAGE_URI=$(python3 -c "import json; d=json.load(open('image_metadata.json')); print(d['imageUri'])")
      - echo "Testing image: ${IMAGE_URI}"
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" |
          docker login --username AWS --password-stdin "$ECR_REPO_URI"
      - docker pull "${IMAGE_URI}"

  build:
    commands:
      - echo "=== Security gate ==="

      # Start the backend container — same image that will go to ECS.
      # Use a local SQLite database (DATABASE_URL env var) so the gate doesn't
      # need RDS connectivity from inside CodeBuild.
      - docker run -d
          --name agentatlas-test
          -p 8000:8000
          -e DATABASE_URL="sqlite+aiosqlite:///./test.db"
          -e JWT_SECRET="security-gate-test-secret-do-not-use-in-prod"
          -e ENVIRONMENT="test"
          -e LOG_LEVEL="WARNING"
          "${IMAGE_URI}"

      # Wait for the container to be ready (healthz is liveness-only, fast)
      - |
        echo "Waiting for container to be healthy..."
        for i in $(seq 1 20); do
          if curl -sf http://localhost:8000/healthz; then
            echo "Container healthy after ${i} attempts"
            break
          fi
          if [ "$i" -eq 20 ]; then
            echo "Container failed to become healthy — showing logs:"
            docker logs agentatlas-test
            exit 1
          fi
          sleep 2
        done

      # Wait a bit more for the readiness check (DB init + seed takes a moment)
      - |
        echo "Waiting for readiness..."
        for i in $(seq 1 15); do
          if curl -sf http://localhost:8000/readyz; then
            echo "Container ready"
            break
          fi
          if [ "$i" -eq 15 ]; then
            echo "Container not ready — showing logs:"
            docker logs agentatlas-test
            exit 1
          fi
          sleep 2
        done

      # Run the security gate — the same battery that scored 100/100 in dev
      - echo "Running security regression suite..."
      - python3 production/cicd/security_gate.py
          --port 8000
          --min-score 95
      - GATE_EXIT=$?
      - echo "Security gate exit code: ${GATE_EXIT}"
      - exit $GATE_EXIT

  post_build:
    commands:
      - echo "=== Post-build cleanup ==="
      - docker logs agentatlas-test > /tmp/container-test.log 2>&1 || true
      - docker stop agentatlas-test || true
      - docker rm agentatlas-test   || true
      - echo "Container cleaned up"

artifacts:
  files:
    - /tmp/container-test.log
  discard-paths: yes
