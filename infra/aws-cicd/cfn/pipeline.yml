AWSTemplateFormatVersion: "2010-09-09"
Description: >
  AgentAtlas — AWS native CI/CD pipeline
  CodePipeline → CodeBuild (test + build + push) → CodeDeploy (ECS blue/green)
  All resources tagged, all secrets from Secrets Manager, no long-lived credentials.

Parameters:
  ProjectName:
    Type: String
    Default: agentatlas

  Environment:
    Type: String
    Default: mvp
    AllowedValues: [dev, mvp, staging, production]

  GitHubOwner:
    Type: String
    Description: GitHub org or username that owns the repository

  GitHubRepo:
    Type: String
    Default: agentatlas

  GitHubBranch:
    Type: String
    Default: main

  GitHubConnectionArn:
    Type: String
    Description: >
      ARN of an AWS CodeStar Connection to GitHub (created once in the console
      under Developer Tools → Connections, then approved from the GitHub side).
      This replaces the old OAuth token approach — no personal access token
      stored anywhere.

  ECSClusterName:
    Type: String
    Description: Name of the existing ECS cluster (from Terraform output ecs_cluster_name)

  ECSServiceName:
    Type: String
    Description: Name of the existing ECS service (from Terraform output ecs_service_name)

  ECRRepositoryUri:
    Type: String
    Description: Full ECR repository URI without tag (from Terraform output ecr_repository_url)

  ALBListenerArn:
    Type: String
    Description: ARN of the ALB listener (used by CodeDeploy blue/green traffic shifting)

  ALBTargetGroupBlueName:
    Type: String
    Description: Name of the blue target group

  ALBTargetGroupGreenName:
    Type: String
    Description: Name of the green target group (CodeDeploy creates during first deploy)

  NotificationEmail:
    Type: String
    Default: platform-team@veliqhq.com

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: "Project" }
        Parameters: [ProjectName, Environment]
      - Label: { default: "Source" }
        Parameters: [GitHubOwner, GitHubRepo, GitHubBranch, GitHubConnectionArn]
      - Label: { default: "ECS / ECR" }
        Parameters: [ECSClusterName, ECSServiceName, ECRRepositoryUri]
      - Label: { default: "ALB (blue/green)" }
        Parameters: [ALBListenerArn, ALBTargetGroupBlueName, ALBTargetGroupGreenName]
      - Label: { default: "Notifications" }
        Parameters: [NotificationEmail]

Resources:

  # ── Artifact bucket — encrypted, versioned, auto-expiring ─────────────────
  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${ProjectName}-${Environment}-pipeline-artifacts-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref ArtifactKMSKey
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-artifacts
            Status: Enabled
            ExpirationInDays: 30
            NoncurrentVersionExpirationInDays: 7
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  ArtifactKMSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "${ProjectName}-${Environment} pipeline artifact encryption"
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowAccountRoot
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          - Sid: AllowCodeBuildAndPipeline
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey
            Resource: "*"
            Condition:
              StringEquals:
                "kms:CallerAccount": !Ref AWS::AccountId
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  ArtifactKMSKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${ProjectName}-${Environment}-pipeline"
      TargetKeyId: !Ref ArtifactKMSKey

  # ── SNS for pipeline failure notifications ─────────────────────────────────
  PipelineNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${ProjectName}-${Environment}-pipeline-notifications"
      Subscription:
        - Protocol: email
          Endpoint: !Ref NotificationEmail

  # ── CodeBuild IAM role ────────────────────────────────────────────────────
  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${Environment}-codebuild-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryPowerUser
      Policies:
        - PolicyName: CodeBuildPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${ProjectName}-*"
              - Sid: ArtifactBucket
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:GetObjectVersion
                Resource:
                  - !Sub "${ArtifactBucket.Arn}/*"
              - Sid: KMS
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource: !GetAtt ArtifactKMSKey.Arn
              - Sid: SecretsManager
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${ProjectName}/*"
              - Sid: SSMParameters
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource:
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/*"
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # ── CodePipeline IAM role ─────────────────────────────────────────────────
  CodePipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${Environment}-pipeline-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodePipelinePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ArtifactBucket
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:GetBucketVersioning
                  - s3:ListBucket
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub "${ArtifactBucket.Arn}/*"
              - Sid: KMS
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource: !GetAtt ArtifactKMSKey.Arn
              - Sid: CodeBuild
                Effect: Allow
                Action:
                  - codebuild:BatchGetBuilds
                  - codebuild:StartBuild
                Resource:
                  - !GetAtt BuildAndTestProject.Arn
                  - !GetAtt SecurityGateProject.Arn
              - Sid: CodeDeploy
                Effect: Allow
                Action:
                  - codedeploy:CreateDeployment
                  - codedeploy:GetApplication
                  - codedeploy:GetApplicationRevision
                  - codedeploy:GetDeployment
                  - codedeploy:GetDeploymentConfig
                  - codedeploy:RegisterApplicationRevision
                Resource: "*"
              - Sid: ECS
                Effect: Allow
                Action:
                  - ecs:DescribeServices
                  - ecs:DescribeTaskDefinition
                  - ecs:DescribeTasks
                  - ecs:ListTasks
                  - ecs:RegisterTaskDefinition
                  - ecs:TagResource
                  - ecs:UpdateService
                Resource: "*"
              - Sid: PassRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt ECSTaskExecutionRole.Arn
              - Sid: CodeStarConnections
                Effect: Allow
                Action: codestar-connections:UseConnection
                Resource: !Ref GitHubConnectionArn
              - Sid: SNS
                Effect: Allow
                Action: sns:Publish
                Resource: !Ref PipelineNotificationTopic
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # ── CodeDeploy IAM role ───────────────────────────────────────────────────
  CodeDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${Environment}-codedeploy-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codedeploy.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSCodeDeployRoleForECS
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # ECS task execution role (for pulling from ECR + reading Secrets Manager)
  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${Environment}-ecs-execution-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: SecretsManagerAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${ProjectName}/*"
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # ── CodeBuild log groups ──────────────────────────────────────────────────
  BuildLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/codebuild/${ProjectName}-${Environment}-build"
      RetentionInDays: 30

  SecurityGateLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/codebuild/${ProjectName}-${Environment}-security-gate"
      RetentionInDays: 30

  # ── CodeBuild project: Test + Build + Push ────────────────────────────────
  BuildAndTestProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-build"
      Description: Run tests, build Docker image, push to ECR
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        Image: aws/codebuild/standard:7.0
        ComputeType: BUILD_GENERAL1_MEDIUM
        PrivilegedMode: true  # required for Docker build inside CodeBuild
        EnvironmentVariables:
          - Name: PROJECT_NAME
            Value: !Ref ProjectName
          - Name: ENVIRONMENT
            Value: !Ref Environment
          - Name: ECR_REPO_URI
            Value: !Ref ECRRepositoryUri
          - Name: AWS_DEFAULT_REGION
            Value: !Ref AWS::Region
          - Name: AWS_ACCOUNT_ID
            Value: !Ref AWS::AccountId
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspecs/buildspec_build.yml
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref BuildLogGroup
      Cache:
        Type: LOCAL
        Modes:
          - LOCAL_DOCKER_LAYER_CACHE
          - LOCAL_SOURCE_CACHE
          - LOCAL_CUSTOM_CACHE
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # ── CodeBuild project: Security gate ─────────────────────────────────────
  SecurityGateProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-security-gate"
      Description: >
        Boot the built image locally, run the 22-check security regression suite.
        Fail the pipeline if score < 95.
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        Image: aws/codebuild/standard:7.0
        ComputeType: BUILD_GENERAL1_SMALL
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: ECR_REPO_URI
            Value: !Ref ECRRepositoryUri
          - Name: AWS_DEFAULT_REGION
            Value: !Ref AWS::Region
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspecs/buildspec_security.yml
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref SecurityGateLogGroup
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # ── CodeDeploy application and deployment group ───────────────────────────
  CodeDeployApplication:
    Type: AWS::CodeDeploy::Application
    Properties:
      ApplicationName: !Sub "${ProjectName}-${Environment}"
      ComputePlatform: ECS

  CodeDeployDeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    Properties:
      ApplicationName: !Ref CodeDeployApplication
      DeploymentGroupName: !Sub "${ProjectName}-${Environment}-dg"
      ServiceRoleArn: !GetAtt CodeDeployRole.Arn
      DeploymentConfigName: CodeDeployDefault.ECSLinear10PercentEvery1Minutes
      DeploymentStyle:
        DeploymentType: BLUE_GREEN
        DeploymentOption: WITH_TRAFFIC_CONTROL
      BlueGreenDeploymentConfiguration:
        DeploymentReadyOption:
          ActionOnTimeout: CONTINUE_DEPLOYMENT
          WaitTimeInMinutes: 0
        TerminateBlueInstancesOnDeploymentSuccess:
          Action: TERMINATE
          TerminationWaitTimeInMinutes: 5
      LoadBalancerInfo:
        TargetGroupPairInfoList:
          - TargetGroups:
              - Name: !Ref ALBTargetGroupBlueName
              - Name: !Ref ALBTargetGroupGreenName
            ProdTrafficRoute:
              ListenerArns:
                - !Ref ALBListenerArn
      ECSServices:
        - ClusterName: !Ref ECSClusterName
          ServiceName: !Ref ECSServiceName

  # ── CodePipeline ──────────────────────────────────────────────────────────
  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub "${ProjectName}-${Environment}"
      RoleArn: !GetAtt CodePipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
        EncryptionKey:
          Id: !GetAtt ArtifactKMSKey.Arn
          Type: KMS
      Stages:

        # Stage 1 — Source: pull from GitHub via CodeStar Connection
        # No polling — event-driven via CodeStar webhook. Fires within seconds
        # of a push to the configured branch.
        - Name: Source
          Actions:
            - Name: GitHubSource
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: "1"
              Configuration:
                ConnectionArn: !Ref GitHubConnectionArn
                FullRepositoryId: !Sub "${GitHubOwner}/${GitHubRepo}"
                BranchName: !Ref GitHubBranch
                OutputArtifactFormat: CODE_ZIP
                DetectChanges: true
              OutputArtifacts:
                - Name: SourceCode
              RunOrder: 1

        # Stage 2 — Build: pytest + Docker build + ECR push
        - Name: Build
          Actions:
            - Name: TestBuildPush
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref BuildAndTestProject
              InputArtifacts:
                - Name: SourceCode
              OutputArtifacts:
                - Name: BuildOutput
              RunOrder: 1

        # Stage 3 — Security: boot the image, run 22-check gate
        # This stage runs AFTER the image is in ECR but BEFORE it touches ECS.
        # A failing gate means the image never reaches the service — not even staging.
        - Name: SecurityGate
          Actions:
            - Name: RunSecurityGate
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref SecurityGateProject
              InputArtifacts:
                - Name: BuildOutput
              RunOrder: 1

        # Stage 4 — Manual approval (production environments only)
        # For MVP/dev this stage can be skipped by removing it.
        # For production: a human reviews the security gate results and
        # approves — or the pipeline waits 7 days before expiring.
        - Name: Approval
          Actions:
            - Name: ManualApproval
              ActionTypeId:
                Category: Approval
                Owner: AWS
                Provider: Manual
                Version: "1"
              Configuration:
                NotificationArn: !Ref PipelineNotificationTopic
                CustomData: !Sub >
                  Build passed all tests and the 22-check security gate.
                  Review the CodeBuild logs for ${ProjectName}-${Environment}-security-gate
                  before approving deployment to ${Environment}.
                ExternalEntityLink: !Sub >
                  https://${AWS::Region}.console.aws.amazon.com/codesuite/codebuild/${AWS::AccountId}/projects/${ProjectName}-${Environment}-security-gate/history
              RunOrder: 1

        # Stage 5 — Deploy: CodeDeploy blue/green on ECS
        - Name: Deploy
          Actions:
            - Name: BlueGreenDeploy
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CodeDeployToECS
                Version: "1"
              Configuration:
                ApplicationName: !Ref CodeDeployApplication
                DeploymentGroupName: !Ref CodeDeployDeploymentGroup
                TaskDefinitionTemplateArtifact: BuildOutput
                TaskDefinitionTemplatePath: taskdef.json
                AppSpecTemplateArtifact: BuildOutput
                AppSpecTemplatePath: appspec/appspec.yml
                Image1ArtifactName: BuildOutput
                Image1ContainerName: IMAGE_NAME
              InputArtifacts:
                - Name: BuildOutput
              RunOrder: 1

  # ── EventBridge rule: notify on pipeline failure ──────────────────────────
  PipelineFailureRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-pipeline-failure"
      Description: Notify on CodePipeline stage failure
      EventPattern:
        source:
          - aws.codepipeline
        detail-type:
          - CodePipeline Stage Execution State Change
        detail:
          state:
            - FAILED
          pipeline:
            - !Ref Pipeline
      Targets:
        - Arn: !Ref PipelineNotificationTopic
          Id: NotifyOnFailure
          InputTransformer:
            InputPathsMap:
              pipeline: "$.detail.pipeline"
              stage: "$.detail.stage"
              state: "$.detail.state"
            InputTemplate: |
              "AgentAtlas pipeline alert: <pipeline> stage <stage> → <state>.
               Check the console: https://console.aws.amazon.com/codesuite/codepipeline/pipelines"

# ── Outputs ────────────────────────────────────────────────────────────────
Outputs:
  PipelineUrl:
    Description: Direct link to the pipeline in the AWS console
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/codesuite/codepipeline/pipelines/${Pipeline}/view"

  ArtifactBucketName:
    Value: !Ref ArtifactBucket

  PipelineName:
    Value: !Ref Pipeline

  BuildProjectName:
    Value: !Ref BuildAndTestProject

  SecurityGateProjectName:
    Value: !Ref SecurityGateProject

  NotificationTopicArn:
    Value: !Ref PipelineNotificationTopic
