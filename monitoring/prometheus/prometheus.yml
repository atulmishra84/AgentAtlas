# Prometheus configuration — scrapes via ServiceMonitor CRDs (kube-prometheus-stack)
# rather than static_configs, so a new pod is auto-discovered the moment it
# carries the `prometheus.io/scrape: "true"` annotation, with zero config
# changes needed when the API scales from 2 pods to 12 under the HPA.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: agentatlas-production

rule_files:
  - /etc/prometheus/rules/agentatlas-alerts.yml

scrape_configs:
  - job_name: agentatlas-api
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [agentatlas-production]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node
